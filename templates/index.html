<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>🌤 Weather App</h1>

        <div class="search-box">

            <input
                type="text"
                id="city"
                placeholder="Enter city name">

            <button onclick="getWeather()">

                Search

            </button>

        </div>

        <div id="error"></div>

        <div id="weather-card" class="weather-card" style="display:none;">

            <h2 id="cityName"></h2>

            <img id="icon">

            <h1 id="temp"></h1>

            <p id="description"></p>

            <div class="info">

                <div class="box">

                    <h3>💧 Humidity</h3>

                    <p id="humidity"></p>

                </div>

                <div class="box">

                    <h3>💨 Wind Speed</h3>

                    <p id="wind"></p>

                </div>

                <div class="box">

                    <h3>☀ UV Index</h3>

                    <p id="uv"></p>

                </div>

                <div class="box">

                    <h3>🥵 Feels Like</h3>

                    <p id="feels"></p>

                </div>

                <div class="box">

                    <h3>🌡 Pressure</h3>

                    <p id="pressure"></p>

                </div>

            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
